/* HEADER */
#header{padding:52px 20px 16px;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:0;z-index:10;}
#header-top{display:flex;justify-content:space-between;align-items:flex-start;}
#week-label{font-size:11px;font-weight:500;color:#94A3B8;letter-spacing:1px;text-transform:uppercase;}
h1{font-size:26px;font-weight:700;color:#1E293B;font-family:'DM Serif Display',serif;margin-top:4px;}
#week-btn{background:#F1F5F9;color:#475569;border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;}
#week-btn.full{background:#1E293B;color:#fff;}
.alert{margin-top:12px;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500;}
.alert.sunday{background:#FEF3C7;color:#92400E;}
.alert.friday{background:#ECFDF5;color:#065F46;}

/* CONTENT */
#content{padding:20px 16px;max-width:480px;margin:0 auto;}

/* CARDS */
.card{background:white;border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,0.06);}
.card-header{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;}
.card-title{font-weight:700;font-size:15px;color:#1E293B;}
.badge{border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;}
.empty{padding:12px 16px;font-size:13px;color:#CBD5E1;font-style:italic;}

/* TASK ROW */
.task-row{display:flex;align-items:center;gap:8px;padding:11px 16px;transition:all 0.35s cubic-bezier(.4,0,.2,1);}
.task-row.removing{opacity:0;transform:translateX(60px) scale(0.95);}
.task-text{flex:1;font-size:14px;color:#334155;line-height:1.4;}
.task-text.done-text{color:#94A3B8;text-decoration:line-through;}
.check-btn{width:26px;height:26px;border-radius:50%;border-width:2px;border-style:solid;background:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.icon-btn{background:none;border:none;font-size:15px;padding:4px;opacity:0.35;}
.icon-btn.active{opacity:1;}
.del-btn{background:none;border:none;font-size:18px;padding:4px;opacity:0.2;}

/* ADD FORM */
#add-card{background:white;border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:0 2px 20px rgba(0,0,0,0.06);}
#add-label{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px;}
#bac-selector{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.bac-pill{padding:6px 12px;border-radius:20px;border-width:1.5px;border-style:solid;font-size:12px;font-weight:600;}
#input-row{display:flex;gap:8px;}
#task-input{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid #E2E8F0;font-size:14px;color:#334155;background:#F8FAFC;font-family:'DM Sans',sans-serif;}
#add-btn{padding:12px 18px;border-radius:12px;border:none;color:white;font-size:18px;font-weight:700;}

/* DONE SECTION */
#done-toggle{width:100%;padding:14px 16px;background:none;border:none;display:flex;justify-content:space-between;align-items:center;}
#clear-done{font-size:12px;color:#EF4444;background:none;border:none;font-weight:600;padding:10px 16px;}

/* PRIORITIES */
#priorities-card{background:white;border-radius:18px;padding:16px;margin-bottom:20px;box-shadow:0 2px 20px rgba(0,0,0,0.06);display:none;}
#prio-label{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;}
.prio-row{display:flex;align-items:center;gap:10px;padding:8px 0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:50;display:none;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-box{width:100%;max-width:480px;margin:0 auto;background:white;border-radius:24px 24px 0 0;padding:24px 20px 40px;}
.modal-handle{width:40px;height:4px;background:#E2E8F0;border-radius:2px;margin:0 auto 20px;}
.modal-title{font-size:20px;font-weight:700;color:#1E293B;font-family:'DM Serif Display',serif;margin-bottom:6px;}
.modal-sub{font-size:13px;color:#64748B;margin-bottom:20px;}
.modal-section{background:#F8FAFC;border-radius:14px;padding:14px;}
.modal-section-label{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.modal-empty{font-size:13px;color:#CBD5E1;font-style:italic;}
.modal-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F1F5F9;}
.modal-close-btn{width:100%;margin-top:16px;padding:14px;border-radius:14px;border:none;background:#1E293B;color:white;font-size:15px;font-weight:600;}
.modal-cancel-btn{flex:1;padding:14px;border-radius:14px;border:1.5px solid #E2E8F0;background:white;color:#64748B;font-size:15px;font-weight:600;}
.modal-save-btn{flex:2;padding:14px;border-radius:14px;border:none;background:#1E293B;color:white;font-size:15px;font-weight:600;}
.edit-label{font-size:12px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.edit-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid #E2E8F0;font-size:14px;color:#334155;background:#F8FAFC;font-family:'DM Sans',sans-serif;margin-bottom:16px;}
.edit-btn-row{display:flex;gap:10px;}

/* TOAST */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1E293B;color:white;padding:12px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:100;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,0.2);display:none;}

<body>

<!-- HEADER -->

<div id="header">
  <div id="header-top">
    <div>
      <p id="week-label"></p>
      <h1>Mon Système</h1>
    </div>
    <button id="week-btn" onclick="openWeekModal()">🎯 0/3</button>
  </div>
  <div id="day-alert"></div>
</div>

<!-- CONTENT -->

<div id="content">
  <!-- Priorités semaine -->
  <div id="priorities-card" class="card">
    <p id="prio-label">🎯 Priorités de la semaine</p>
    <div id="priorities-list"></div>
  </div>

  <!-- Ajout tâche -->

  <div id="add-card">
    <p id="add-label">+ Ajouter une tâche</p>
    <div id="bac-selector"></div>
    <div id="input-row">
      <input id="task-input" type="text" placeholder="Quelle est la prochaine action concrète ?" onkeydown="if(event.key==='Enter') addTask()"/>
      <button id="add-btn" onclick="addTask()">+</button>
    </div>
  </div>

  <!-- Bacs -->

  <div id="bacs-container"></div>

  <!-- Fait -->

  <div class="card" id="done-card">
    <button id="done-toggle" onclick="toggleDone()">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:20px">✅</span>
        <span style="font-weight:700;font-size:15px;color:#1E293B;">Fait cette semaine</span>
        <span id="done-badge" class="badge" style="display:none;background:#F0FDF4;color:#16A34A;"></span>
      </div>
      <span id="done-arrow" style="color:#94A3B8;font-size:18px;">▼</span>
    </button>
    <div id="done-list" style="display:none;"></div>
  </div>
</div>

<!-- MODAL SEMAINE -->

<div class="modal-overlay" id="week-modal" onclick="closeWeekModal(event)">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <h2 class="modal-title">🎯 Priorités de la semaine</h2>
    <p class="modal-sub">Max 3 tâches. Tape 🎯 sur une tâche pour l'épingler.</p>
    <div class="modal-section">
      <p class="modal-section-label" id="prio-count-label">Épinglées (0/3)</p>
      <div id="modal-prio-list"></div>
    </div>
    <button class="modal-close-btn" onclick="document.getElementById('week-modal').classList.remove('open')">C'est bon pour cette semaine 🚀</button>
  </div>
</div>

<!-- MODAL EDITION -->

<div class="modal-overlay" id="edit-modal" onclick="closeEditModal(event)">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <h2 class="modal-title">✏️ Modifier la tâche</h2>
    <p class="edit-label">Nom de la tâche</p>
    <input class="edit-input" id="edit-input" type="text"/>
    <p class="edit-label">Déplacer vers</p>
    <div id="edit-bac-selector" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;"></div>
    <div class="edit-btn-row">
      <button class="modal-cancel-btn" onclick="document.getElementById('edit-modal').classList.remove('open')">Annuler</button>
      <button class="modal-save-btn" onclick="saveEdit()">Enregistrer ✓</button>
    </div>
  </div>
</div>

<!-- TOAST -->

<div id="toast"></div>

<script>
const BACS = {
  boulot:      { label:"Boulot",                emoji:"🏢", color:"#2563EB", bg:"#EFF6FF", border:"#BFDBFE" },
  competences: { label:"Montée en compétences", emoji:"📚", color:"#7C3AED", bg:"#F5F3FF", border:"#DDD6FE" },
  maison:      { label:"Maison & Projets",      emoji:"🏠", color:"#059669", bg:"#ECFDF5", border:"#A7F3D0" },
  vitefait:    { label:"Vite fait",             emoji:"⚡", color:"#D97706", bg:"#FFFBEB", border:"#FDE68A" },
};

const KEY = "mon-systeme-v1";
let state = { tasks:{boulot:[],competences:[],maison:[],vitefait:[]}, done:[], weekTasks:[] };
let activeBac = "boulot";
let editId = null;
let editOrigBac = null;
let editBac = "boulot";
let showDone = false;

function loadState() {
  try { const r = localStorage.getItem(KEY); if(r) state = JSON.parse(r); } catch(_) {}
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(_) {}
}
function uid() { return Date.now() + Math.random().toString(36).slice(2); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2500);
}

function getWeekLabel() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay() + 1);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = d => d.toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  return `Semaine du ${fmt(start)} au ${fmt(end)}`;
}

function initHeader() {
  document.getElementById("week-label").textContent = getWeekLabel();
  const day = new Date().getDay();
  const alertEl = document.getElementById("day-alert");
  if (day === 0) {
    alertEl.innerHTML = `<div class="alert sunday">🌅 Dimanche soir — 20 min pour planifier ta semaine. Choisis 3 tâches →</div>`;
  } else if (day === 5) {
    alertEl.innerHTML = `<div class="alert friday">✨ Vendredi midi — 10 min pour clôturer ta semaine.</div>`;
  }
}

function renderBacSelector() {
  const el = document.getElementById("bac-selector");
  el.innerHTML = "";
  Object.entries(BACS).forEach(([key, cfg]) => {
    const btn = document.createElement("button");
    btn.className = "bac-pill";
    btn.textContent = cfg.emoji + " " + cfg.label;
    btn.style.borderColor = activeBac===key ? cfg.color : "#E2E8F0";
    btn.style.background = activeBac===key ? cfg.bg : "white";
    btn.style.color = activeBac===key ? cfg.color : "#64748B";
    btn.onclick = () => { activeBac = key; renderBacSelector(); updateAddBtn(); };
    el.appendChild(btn);
  });
}

function updateAddBtn() {
  const btn = document.getElementById("add-btn");
  btn.style.background = BACS[activeBac].color;
}

function addTask() {
  const input = document.getElementById("task-input");
  const text = input.value.trim();
  if (!text) return;
  const task = { id: uid(), text, bac: activeBac, createdAt: Date.now() };
  state.tasks[activeBac].push(task);
  saveState();
  input.value = "";
  render();
  showToast("Tâche ajoutée ✓");
}

function completeTask(id, bac) {
  const idx = state.tasks[bac].findIndex(t => t.id === id);
  if (idx === -1) return;
  const task = state.tasks[bac].splice(idx, 1)[0];
  state.weekTasks = state.weekTasks.filter(x => x !== id);
  state.done.unshift({ ...task, doneAt: Date.now() });
  saveState();
  render();
  showToast("Bravo ! ✅ Déplacé dans « Fait »");
}

function undoTask(id) {
  const idx = state.done.findIndex(t => t.id === id);
  if (idx === -1) return;
  const task = state.done.splice(idx, 1)[0];
  const { doneAt, ...restored } = task;
  state.tasks[restored.bac].unshift(restored);
  saveState();
  render();
  showToast("↩️ Tâche remise dans " + BACS[restored.bac].label);
}

function deleteTask(id, bac) {
  state.tasks[bac] = state.tasks[bac].filter(t => t.id !== id);
  state.weekTasks = state.weekTasks.filter(x => x !== id);
  saveState();
  render();
}

function toggleWeek(id) {
  if (state.weekTasks.includes(id)) {
    state.weekTasks = state.weekTasks.filter(x => x !== id);
  } else if (state.weekTasks.length < 3) {
    state.weekTasks.push(id);
  } else {
    showToast("Max 3 priorités !"); return;
  }
  saveState();
  render();
}

function openEdit(id, bac) {
  const task = state.tasks[bac].find(t => t.id === id);
  if (!task) return;
  editId = id;
  editOrigBac = bac;
  editBac = bac;
  document.getElementById("edit-input").value = task.text;
  renderEditBacSelector();
  document.getElementById("edit-modal").classList.add("open");
}

function renderEditBacSelector() {
  const el = document.getElementById("edit-bac-selector");
  el.innerHTML = "";
  Object.entries(BACS).forEach(([key, cfg]) => {
    const btn = document.createElement("button");
    btn.className = "bac-pill";
    btn.textContent = cfg.emoji + " " + cfg.label;
    btn.style.borderColor = editBac===key ? cfg.color : "#E2E8F0";
    btn.style.background = editBac===key ? cfg.bg : "white";
    btn.style.color = editBac===key ? cfg.color : "#64748B";
    btn.onclick = () => { editBac = key; renderEditBacSelector(); };
    el.appendChild(btn);
  });
}

function saveEdit() {
  const text = document.getElementById("edit-input").value.trim();
  if (!text || !editId) return;
  const idx = state.tasks[editOrigBac].findIndex(t => t.id === editId);
  if (idx === -1) return;
  const task = state.tasks[editOrigBac].splice(idx, 1)[0];
  task.text = text;
  task.bac = editBac;
  state.tasks[editBac].unshift(task);
  saveState();
  document.getElementById("edit-modal").classList.remove("open");
  render();
  showToast("✏️ Tâche modifiée !");
}

function closeEditModal(e) {
  if (e.target.id === "edit-modal") document.getElementById("edit-modal").classList.remove("open");
}

function openWeekModal() {
  renderWeekModal();
  document.getElementById("week-modal").classList.add("open");
}

function closeWeekModal(e) {
  if (e.target.id === "week-modal") document.getElementById("week-modal").classList.remove("open");
}

function renderWeekModal() {
  const allTasks = Object.values(state.tasks).flat();
  const pinned = allTasks.filter(t => state.weekTasks.includes(t.id));
  const el = document.getElementById("modal-prio-list");
  document.getElementById("prio-count-label").textContent = `Épinglées (${pinned.length}/3)`;
  el.innerHTML = "";
  if (pinned.length === 0) {
    el.innerHTML = `<p class="modal-empty">Tape 🎯 sur une tâche pour l'épingler ici</p>`;
  } else {
    pinned.forEach(task => {
      const row = document.createElement("div");
      row.className = "modal-row";
      row.innerHTML = `<span>${BACS[task.bac].emoji}</span><span style="flex:1;font-size:14px;color:#334155;">${task.text}</span>`;
      const del = document.createElement("button");
      del.textContent = "×";
      del.style.cssText = "background:none;border:none;font-size:16px;color:#EF4444;cursor:pointer;";
      del.onclick = () => { toggleWeek(task.id); renderWeekModal(); };
      row.appendChild(del);
      el.appendChild(row);
    });
  }
}

function toggleDone() {
  showDone = !showDone;
  document.getElementById("done-list").style.display = showDone ? "block" : "none";
  document.getElementById("done-arrow").textContent = showDone ? "▲" : "▼";
}

function render() {
  renderPriorities();
  renderBacs();
  renderDone();
  renderWeekBtn();
}

function renderWeekBtn() {
  const btn = document.getElementById("week-btn");
  const count = state.weekTasks.length;
  btn.textContent = `🎯 ${count}/3`;
  btn.className = count === 3 ? "full" : "";
}

function renderPriorities() {
  const allTasks = Object.values(state.tasks).flat();
  const pinned = allTasks.filter(t => state.weekTasks.includes(t.id));
  const card = document.getElementById("priorities-card");
  const list = document.getElementById("priorities-list");
  card.style.display = pinned.length > 0 ? "block" : "none";
  list.innerHTML = "";
  pinned.forEach((task, i) => {
    const cfg = BACS[task.bac];
    const row = document.createElement("div");
    row.className = "prio-row";
    row.style.borderBottom = i < pinned.length-1 ? "1px solid #F1F5F9" : "none";
    row.innerHTML = `
      <button class="check-btn" style="border-color:${cfg.color};" onclick="completeTask('${task.id}','${task.bac}')">
        <span>${cfg.emoji}</span>
      </button>
      <span style="flex:1;font-size:14px;color:#334155;">${task.text}</span>
      <span style="font-size:11px;color:${cfg.color};font-weight:600;">${cfg.label}</span>
    `;
    list.appendChild(row);
  });
}

function renderBacs() {
  const container = document.getElementById("bacs-container");
  container.innerHTML = "";
  Object.entries(BACS).forEach(([key, cfg]) => {
    const tasks = state.tasks[key];
    const div = document.createElement("div");
    div.className = "card";
    // Header
    const hdr = document.createElement("div");
    hdr.className = "card-header";
    hdr.style.borderBottom = tasks.length ? `1px solid ${cfg.border}` : "none";
    hdr.innerHTML = `<span style="font-size:20px">${cfg.emoji}</span><span class="card-title">${cfg.label}</span>`;
    if (tasks.length > 0) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.style.background = cfg.bg;
      badge.style.color = cfg.color;
      badge.textContent = tasks.length;
      hdr.appendChild(badge);
    }
    div.appendChild(hdr);
    // Tasks
    if (tasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Aucune tâche — tu es à jour 👌";
      div.appendChild(empty);
    } else {
      tasks.forEach((task, i) => {
        const pinned = state.weekTasks.includes(task.id);
        const row = document.createElement("div");
        row.className = "task-row";
        row.style.borderBottom = i < tasks.length-1 ? `1px solid ${cfg.border}` : "none";
        row.style.background = pinned ? cfg.bg : "white";
        row.innerHTML = `
          <button class="check-btn" style="border-color:${cfg.color};" onclick="completeTask('${task.id}','${key}')">
            <span style="color:${cfg.color}">✓</span>
          </button>
          <span class="task-text">${task.text}</span>
          <button class="icon-btn" onclick="openEdit('${task.id}','${key}')" title="Modifier">✏️</button>
          <button class="icon-btn ${pinned?'active':''}" onclick="toggleWeek('${task.id}')" title="Épingler">🎯</button>
          <button class="del-btn" onclick="deleteTask('${task.id}','${key}')">×</button>
        `;
        div.appendChild(row);
      });
    }
    container.appendChild(div);
  });
}

function renderDone() {
  const list = document.getElementById("done-list");
  const badge = document.getElementById("done-badge");
  const count = state.done.length;
  if (count > 0) {
    badge.style.display = "inline-block";
    badge.textContent = count;
  } else {
    badge.style.display = "none";
  }
  list.innerHTML = "";
  if (count === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Coche une tâche pour la voir ici !";
    list.appendChild(empty);
  } else {
    state.done.forEach(task => {
      const cfg = BACS[task.bac];
      const row = document.createElement("div");
      row.className = "task-row";
      row.style.borderTop = "1px solid #F0FDF4";
      row.innerHTML = `
        <span style="font-size:16px">✅</span>
        <span class="task-text done-text">${task.text}</span>
        <button class="icon-btn active" onclick="undoTask('${task.id}')" title="Annuler par erreur">↩️</button>
        <span style="font-size:11px;color:${cfg.color};font-weight:600;">${cfg.emoji}</span>
      `;
      list.appendChild(row);
    });
    const clearRow = document.createElement("div");
    clearRow.style.borderTop = "1px solid #F0FDF4";
    clearRow.innerHTML = `<button id="clear-done" onclick="clearDone()">🗑 Effacer l'historique</button>`;
    list.appendChild(clearRow);
  }
}

function clearDone() {
  state.done = [];
  saveState();
  render();
  showToast("Historique effacé");
}

// INIT
loadState();
initHeader();
renderBacSelector();
updateAddBtn();
render();
</script>

</body>
</html>
