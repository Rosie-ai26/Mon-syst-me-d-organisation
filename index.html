  <script type="text/babel">

const BAC_CONFIG = {
  boulot:      { label: "Boulot",                emoji: "🏢", color: "#2563EB", bg: "#EFF6FF", border: "#BFDBFE" },
  competences: { label: "Montée en compétences", emoji: "📚", color: "#7C3AED", bg: "#F5F3FF", border: "#DDD6FE" },
  maison:      { label: "Maison & Projets",      emoji: "🏠", color: "#059669", bg: "#ECFDF5", border: "#A7F3D0" },
  vitefait:    { label: "Vite fait",             emoji: "⚡", color: "#D97706", bg: "#FFFBEB", border: "#FDE68A" },
};

const STORAGE_KEY = "mon-systeme-v1";
let idCounter = Date.now();
function uid() { return ++idCounter + Math.random().toString(36).slice(2); }

function getWeekLabel() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - now.getDay() + 1);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const fmt = d => d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  return `Semaine du ${fmt(start)} au ${fmt(end)}`;
}

function getDayLabel() {
  const d = new Date().getDay();
  if (d === 0) return "sunday";
  if (d === 5) return "friday";
  return null;
}

function load() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch(_) {}
  return null;
}
function save(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(_) {}
}

const defaultTasks = { boulot: [], competences: [], maison: [], vitefait: [] };

function App() {
  const saved = load();
  const [tasks,     setTasks]     = useState(saved?.tasks     || defaultTasks);
  const [done,      setDone]      = useState(saved?.done      || []);
  const [weekTasks, setWeekTasks] = useState(saved?.weekTasks || []);
  const [input,     setInput]     = useState("");
  const [activeBac, setActiveBac] = useState("boulot");
  const [showDone,  setShowDone]  = useState(false);
  const [showModal, setShowModal] = useState(false);
  const [toast,     setToast]     = useState(null);
  const [removing,  setRemoving]  = useState({});
  const [editTask,  setEditTask]  = useState(null);
  const [editText,  setEditText]  = useState("");
  const [editBac,   setEditBac]   = useState("boulot");
  const inputRef = useRef();

  useEffect(() => { save({ tasks, done, weekTasks }); }, [tasks, done, weekTasks]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }

  function addTask() {
    if (!input.trim()) return;
    const task = { id: uid(), text: input.trim(), bac: activeBac, createdAt: Date.now() };
    setTasks(t => ({ ...t, [activeBac]: [...t[activeBac], task] }));
    setInput("");
    inputRef.current?.focus();
    showToast("Tâche ajoutée ✓");
  }

  function completeTask(task) {
    setRemoving(r => ({ ...r, [task.id]: true }));
    setTimeout(() => {
      setTasks(t => ({ ...t, [task.bac]: t[task.bac].filter(x => x.id !== task.id) }));
      setWeekTasks(w => w.filter(id => id !== task.id));
      setDone(d => [{ ...task, doneAt: Date.now() }, ...d]);
      setRemoving(r => { const n = { ...r }; delete n[task.id]; return n; });
      showToast("Bravo ! ✅ Déplacé dans « Fait »");
    }, 400);
  }

  function undoTask(task) {
    setDone(d => d.filter(x => x.id !== task.id));
    const { doneAt, ...restored } = task;
    setTasks(t => ({ ...t, [restored.bac]: [restored, ...t[restored.bac]] }));
    showToast("↩️ Tâche remise dans " + BAC_CONFIG[restored.bac].label);
  }

  function deleteTask(task) {
    setRemoving(r => ({ ...r, [task.id]: true }));
    setTimeout(() => {
      setTasks(t => ({ ...t, [task.bac]: t[task.bac].filter(x => x.id !== task.id) }));
      setWeekTasks(w => w.filter(id => id !== task.id));
      setRemoving(r => { const n = { ...r }; delete n[task.id]; return n; });
    }, 400);
  }

  function openEdit(task) {
    setEditTask(task);
    setEditText(task.text);
    setEditBac(task.bac);
  }

  function saveEdit() {
    if (!editText.trim()) return;
    const updated = { ...editTask, text: editText.trim(), bac: editBac };
    setTasks(t => {
      const n = { ...t };
      n[editTask.bac] = n[editTask.bac].filter(x => x.id !== editTask.id);
      n[editBac] = [updated, ...n[editBac].filter(x => x.id !== editTask.id)];
      return n;
    });
    setEditTask(null);
    showToast("✏️ Tâche modifiée !");
  }

  function toggleWeek(id) {
    setWeekTasks(w =>
      w.includes(id) ? w.filter(x => x !== id)
      : w.length < 3 ? [...w, id]
      : (showToast("Max 3 priorités !"), w)
    );
  }

  const allTasks     = Object.values(tasks).flat();
  const weekSelected = allTasks.filter(t => weekTasks.includes(t.id));
  const dayAlert     = getDayLabel();

  return (
    <div style={{ minHeight:"100vh", paddingBottom:80 }}>

      {/* HEADER */}
      <div style={{ padding:"52px 20px 16px", background:"rgba(255,255,255,0.75)", backdropFilter:"blur(20px)", borderBottom:"1px solid rgba(0,0,0,0.06)", position:"sticky", top:0, zIndex:10 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <p style={{ fontSize:11, fontWeight:500, color:"#94A3B8", letterSpacing:1, textTransform:"uppercase" }}>{getWeekLabel()}</p>
            <h1 style={{ fontSize:26, fontWeight:700, color:"#1E293B", fontFamily:"'DM Serif Display', serif", marginTop:4 }}>Mon Système</h1>
          </div>
          <button className="pill-btn" onClick={() => setShowModal(true)}
            style={{ background:weekSelected.length===3?"#1E293B":"#F1F5F9", color:weekSelected.length===3?"#fff":"#475569", border:"none", borderRadius:20, padding:"8px 14px", fontSize:13, fontWeight:600 }}>
            🎯 {weekSelected.length}/3
          </button>
        </div>
        {dayAlert==="sunday" && <div style={{ marginTop:12, background:"#FEF3C7", borderRadius:12, padding:"10px 14px", fontSize:13, color:"#92400E", fontWeight:500 }}>🌅 Dimanche soir — 20 min pour planifier ta semaine. Choisis 3 tâches →</div>}
        {dayAlert==="friday" && <div style={{ marginTop:12, background:"#ECFDF5", borderRadius:12, padding:"10px 14px", fontSize:13, color:"#065F46", fontWeight:500 }}>✨ Vendredi midi — 10 min pour clôturer ta semaine.</div>}
      </div>

      <div style={{ padding:"20px 16px", maxWidth:480, margin:"0 auto" }}>

        {/* PRIORITES SEMAINE */}
        {weekSelected.length > 0 && (
          <div className="fade-in" style={{ marginBottom:20, background:"white", borderRadius:18, padding:16, boxShadow:"0 2px 20px rgba(0,0,0,0.06)" }}>
            <p style={{ fontSize:11, fontWeight:600, color:"#64748B", textTransform:"uppercase", letterSpacing:0.8, marginBottom:12 }}>🎯 Priorités de la semaine</p>
            {weekSelected.map((task, i) => (
              <div key={task.id} className={`task-row ${removing[task.id]?"removing":""}`}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:i<weekSelected.length-1?"1px solid #F1F5F9":"none" }}>
                <button className="check-circle" onClick={() => completeTask(task)}
                  style={{ width:24, height:24, borderRadius:"50%", border:`2px solid ${BAC_CONFIG[task.bac].color}`, background:"white", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <span style={{ fontSize:10 }}>{BAC_CONFIG[task.bac].emoji}</span>
                </button>
                <span style={{ fontSize:14, color:"#334155", flex:1 }}>{task.text}</span>
                <span style={{ fontSize:11, color:BAC_CONFIG[task.bac].color, fontWeight:600 }}>{BAC_CONFIG[task.bac].label}</span>
              </div>
            ))}
          </div>
        )}

        {/* AJOUT TACHE */}
        <div style={{ background:"white", borderRadius:18, padding:16, marginBottom:20, boxShadow:"0 2px 20px rgba(0,0,0,0.06)" }}>
          <p style={{ fontSize:11, fontWeight:600, color:"#64748B", textTransform:"uppercase", letterSpacing:0.8, marginBottom:10 }}>+ Ajouter une tâche</p>
          <div style={{ display:"flex", gap:8, marginBottom:10, flexWrap:"wrap" }}>
            {Object.entries(BAC_CONFIG).map(([key, cfg]) => (
              <button key={key} className="pill-btn" onClick={() => setActiveBac(key)}
                style={{ padding:"6px 12px", borderRadius:20, border:`1.5px solid ${activeBac===key?cfg.color:"#E2E8F0"}`, background:activeBac===key?cfg.bg:"white", color:activeBac===key?cfg.color:"#64748B", fontSize:12, fontWeight:600 }}>
                {cfg.emoji} {cfg.label}
              </button>
            ))}
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==="Enter" && addTask()}
              placeholder="Quelle est la prochaine action concrète ?"
              style={{ flex:1, padding:"12px 14px", borderRadius:12, border:"1.5px solid #E2E8F0", fontSize:14, color:"#334155", background:"#F8FAFC" }} />
            <button className="pill-btn" onClick={addTask}
              style={{ padding:"12px 18px", borderRadius:12, border:"none", background:BAC_CONFIG[activeBac].color, color:"white", fontSize:18, fontWeight:700 }}>+</button>
          </div>
        </div>

        {/* BACS */}
        {Object.entries(BAC_CONFIG).map(([key, cfg]) => (
          <div key={key} className="fade-in" style={{ background:"white", borderRadius:18, marginBottom:14, overflow:"hidden", boxShadow:"0 2px 20px rgba(0,0,0,0.05)" }}>
            <div style={{ padding:"14px 16px 10px", borderBottom:tasks[key].length?`1px solid ${cfg.border}`:"none", display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:20 }}>{cfg.emoji}</span>
              <span style={{ fontWeight:700, fontSize:15, color:"#1E293B" }}>{cfg.label}</span>
              {tasks[key].length > 0 && <span style={{ background:cfg.bg, color:cfg.color, borderRadius:10, padding:"2px 8px", fontSize:12, fontWeight:700 }}>{tasks[key].length}</span>}
            </div>
            {tasks[key].length === 0 ? (
              <div style={{ padding:"12px 16px", fontSize:13, color:"#CBD5E1", fontStyle:"italic" }}>Aucune tâche — tu es à jour 👌</div>
            ) : tasks[key].map((task, i) => (
              <div key={task.id} className={`task-row ${removing[task.id]?"removing":""}`}
                style={{ display:"flex", alignItems:"center", gap:8, padding:"11px 16px", borderBottom:i<tasks[key].length-1?`1px solid ${cfg.border}`:"none", background:weekTasks.includes(task.id)?cfg.bg:"white" }}>
                <button className="check-circle" onClick={() => completeTask(task)}
                  style={{ width:26, height:26, borderRadius:"50%", border:`2px solid ${cfg.color}`, background:"white", cursor:"pointer", flexShrink:0 }}>
                  <span style={{ fontSize:10, color:cfg.color }}>✓</span>
                </button>
                <span style={{ flex:1, fontSize:14, color:"#334155", lineHeight:1.4 }}>{task.text}</span>
                <button onClick={() => openEdit(task)}
                  style={{ background:"none", border:"none", cursor:"pointer", fontSize:15, opacity:0.45, padding:4 }} title="Modifier">✏️</button>
                <button className="check-circle" onClick={() => toggleWeek(task.id)}
                  style={{ background:"none", border:"none", cursor:"pointer", fontSize:15, opacity:weekTasks.includes(task.id)?1:0.3, padding:4 }}>🎯</button>
                <button onClick={() => deleteTask(task)}
                  style={{ background:"none", border:"none", cursor:"pointer", fontSize:18, opacity:0.2, padding:4 }}>×</button>
              </div>
            ))}
          </div>
        ))}

        {/* FAIT */}
        <div style={{ background:"white", borderRadius:18, overflow:"hidden", boxShadow:"0 2px 20px rgba(0,0,0,0.05)" }}>
          <button className="pill-btn" onClick={() => setShowDone(s => !s)}
            style={{ width:"100%", padding:"14px 16px", background:"none", border:"none", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <span style={{ fontSize:20 }}>✅</span>
              <span style={{ fontWeight:700, fontSize:15, color:"#1E293B" }}>Fait cette semaine</span>
              {done.length > 0 && <span style={{ background:"#F0FDF4", color:"#16A34A", borderRadius:10, padding:"2px 8px", fontSize:12, fontWeight:700 }}>{done.length}</span>}
            </div>
            <span style={{ color:"#94A3B8", fontSize:18 }}>{showDone?"▲":"▼"}</span>
          </button>
          {showDone && (
            <div>
              {done.length===0 ? (
                <div style={{ padding:"12px 16px", fontSize:13, color:"#CBD5E1", fontStyle:"italic" }}>Coche une tâche pour la voir ici !</div>
              ) : done.map(task => (
                <div key={task.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"11px 16px", borderTop:"1px solid #F0FDF4" }}>
                  <span style={{ fontSize:16 }}>✅</span>
                  <span style={{ flex:1, fontSize:14, color:"#94A3B8", textDecoration:"line-through" }}>{task.text}</span>
                  <button onClick={() => undoTask(task)} title="Validée par erreur ? Annuler"
                    style={{ background:"none", border:"none", cursor:"pointer", fontSize:16, padding:4 }}>↩️</button>
                  <span style={{ fontSize:11, color:BAC_CONFIG[task.bac].color, fontWeight:600 }}>{BAC_CONFIG[task.bac].emoji}</span>
                </div>
              ))}
              {done.length > 0 && (
                <div style={{ padding:"10px 16px", borderTop:"1px solid #F0FDF4" }}>
                  <button className="pill-btn" onClick={() => { setDone([]); showToast("Historique effacé"); }}
                    style={{ fontSize:12, color:"#EF4444", background:"none", border:"none", fontWeight:600 }}>🗑 Effacer l'historique</button>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* MODAL EDITION */}
      {editTask && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:50, display:"flex", alignItems:"flex-end" }} onClick={() => setEditTask(null)}>
          <div style={{ width:"100%", maxWidth:480, margin:"0 auto", background:"white", borderRadius:"24px 24px 0 0", padding:"24px 20px 40px" }} onClick={e => e.stopPropagation()}>
            <div style={{ width:40, height:4, background:"#E2E8F0", borderRadius:2, margin:"0 auto 20px" }} />
            <h2 style={{ fontSize:20, fontWeight:700, color:"#1E293B", fontFamily:"'DM Serif Display', serif", marginBottom:16 }}>✏️ Modifier la tâche</h2>
            <p style={{ fontSize:12, fontWeight:600, color:"#64748B", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Nom de la tâche</p>
            <input value={editText} onChange={e => setEditText(e.target.value)}
              style={{ width:"100%", padding:"12px 14px", borderRadius:12, border:"1.5px solid #E2E8F0", fontSize:14, color:"#334155", background:"#F8FAFC", marginBottom:16 }} />
            <p style={{ fontSize:12, fontWeight:600, color:"#64748B", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Déplacer vers</p>
            <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:20 }}>
              {Object.entries(BAC_CONFIG).map(([key, cfg]) => (
                <button key={key} className="pill-btn" onClick={() => setEditBac(key)}
                  style={{ padding:"7px 13px", borderRadius:20, border:`1.5px solid ${editBac===key?cfg.color:"#E2E8F0"}`, background:editBac===key?cfg.bg:"white", color:editBac===key?cfg.color:"#64748B", fontSize:12, fontWeight:600 }}>
                  {cfg.emoji} {cfg.label}
                </button>
              ))}
            </div>
            <div style={{ display:"flex", gap:10 }}>
              <button className="pill-btn" onClick={() => setEditTask(null)}
                style={{ flex:1, padding:14, borderRadius:14, border:"1.5px solid #E2E8F0", background:"white", color:"#64748B", fontSize:15, fontWeight:600 }}>
                Annuler
              </button>
              <button className="pill-btn" onClick={saveEdit}
                style={{ flex:2, padding:14, borderRadius:14, border:"none", background:"#1E293B", color:"white", fontSize:15, fontWeight:600 }}>
                Enregistrer ✓
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MODAL SEMAINE */}
      {showModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.4)", zIndex:50, display:"flex", alignItems:"flex-end" }} onClick={() => setShowModal(false)}>
          <div style={{ width:"100%", maxWidth:480, margin:"0 auto", background:"white", borderRadius:"24px 24px 0 0", padding:"24px 20px 40px" }} onClick={e => e.stopPropagation()}>
            <div style={{ width:40, height:4, background:"#E2E8F0", borderRadius:2, margin:"0 auto 20px" }} />
            <h2 style={{ fontSize:20, fontWeight:700, color:"#1E293B", fontFamily:"'DM Serif Display', serif", marginBottom:6 }}>🎯 Priorités de la semaine</h2>
            <p style={{ fontSize:13, color:"#64748B", marginBottom:20 }}>Max 3 tâches. Tape 🎯 sur une tâche pour l'épingler.</p>
            <div style={{ background:"#F8FAFC", borderRadius:14, padding:14 }}>
              <p style={{ fontSize:11, fontWeight:600, color:"#64748B", textTransform:"uppercase", letterSpacing:0.8, marginBottom:8 }}>Épinglées ({weekSelected.length}/3)</p>
              {weekSelected.length===0 ? (
                <p style={{ fontSize:13, color:"#CBD5E1", fontStyle:"italic" }}>Tape 🎯 sur une tâche pour l'épingler ici</p>
              ) : weekSelected.map(task => (
                <div key={task.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 0", borderBottom:"1px solid #F1F5F9" }}>
                  <span>{BAC_CONFIG[task.bac].emoji}</span>
                  <span style={{ flex:1, fontSize:14, color:"#334155" }}>{task.text}</span>
                  <button onClick={() => toggleWeek(task.id)} style={{ background:"none", border:"none", cursor:"pointer", fontSize:16, color:"#EF4444" }}>×</button>
                </div>
              ))}
            </div>
            <button className="pill-btn" onClick={() => setShowModal(false)}
              style={{ width:"100%", marginTop:16, padding:14, borderRadius:14, border:"none", background:"#1E293B", color:"white", fontSize:15, fontWeight:600 }}>
              C'est bon pour cette semaine 🚀
            </button>
          </div>
        </div>
      )}

      {/* TOAST */}
      {toast && (
        <div style={{ position:"fixed", bottom:30, left:"50%", transform:"translateX(-50%)", background:"#1E293B", color:"white", padding:"12px 20px", borderRadius:20, fontSize:14, fontWeight:500, zIndex:100, whiteSpace:"nowrap", boxShadow:"0 8px 30px rgba(0,0,0,0.2)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
